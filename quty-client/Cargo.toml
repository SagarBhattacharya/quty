[package]
name = "quty-client"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
quty-proto = { path = "../quty-proto" }
clap = { version = "4.6.7", features = ["derive"] }
rustyline = "19.0.0"
colored = "3.1.1"
dirs = "7.0.0"

[dependencies.tokio]
version = "1.53.3"
features = [
	"rt-multi-thread",
	"macros",
	"net",
	"io-util"
]

