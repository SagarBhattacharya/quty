[package]
name = "quty-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
quty-proto = { path = "../quty-proto" }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
hdrhistogram = "7.6.0"
rand = "0.10.3"
rand_distr = "0.6.0"
comfy-table = "8.0.1"
colored = "3.1.1"

[dependencies.tokio]
version = "1.53.3"
features = [
	"net",
	"io-util",
	"rt-multi-thread",
	"macros",
	"time"
]