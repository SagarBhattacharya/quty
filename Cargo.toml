[workspace]
members = [
	"quty-proto",
	"quty-client",
	"quty-server",
	"quty-bench"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sagar Bhattacharya"]
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true